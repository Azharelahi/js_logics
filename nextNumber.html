<script>
// Scenario 1: next number in an array
function nextInArray(arr, num) {
  let bigger = arr.filter(x => x > num);
  return bigger.length ? Math.min(...bigger) : "No bigger number found";
}

// Scenario 2: single value, integer or float
function nextNumber(n) {
  if (Number.isInteger(n)) {
    return n + 1;
  }
  return Math.ceil(n);
}

let arr = [4, 9, 15, 22, 31];
console.log("Next after 15 in array:", nextInArray(arr, 15));

let n = parseFloat(prompt("Enter a number (integer or float)"));
alert("Next number: " + nextNumber(n));
</script>
