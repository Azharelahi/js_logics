
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hours to Seconds Converter</title>
</head>
<body>

    <h1>Hours to Seconds Converter</h1>

    <script>
        function hoursToSeconds(hours) {
            return hours * 3600;
        }

        let hours = parseFloat(prompt("Enter hours"));

        alert(hours + " hours = " + hoursToSeconds(hours) + " seconds");
    </script>

</body>
</html>
